<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07566a">
<title>Mahjong Pirates</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=clean-1">
<link rel="stylesheet" href="tile-art.css?v=clean-1">
</head>
<body>
<main class="app-shell">
  <section id="home"></section>

  <section id="map" class="panel hidden">
    <header class="section-head"><div><small>CARTE DES CARAÏBES</small><h2>À la chasse au trésor</h2></div><button id="mapHome" class="wood-btn">Accueil</button></header>
    <div class="island-grid">
      <button class="island" data-level="1"><span>🏝️</span><b>Île du Départ</b><small>48 tuiles</small></button>
      <button class="island" data-level="2"><span>🌴</span><b>Baie des Palmiers</b><small>60 tuiles</small></button>
      <button class="island" data-level="3"><span>🐙</span><b>Île du Kraken</b><small>72 tuiles</small></button>
      <button class="island" data-level="4"><span>🏰</span><b>Fort des Flibustiers</b><small>84 tuiles</small></button>
      <button class="island" data-level="5"><span>💰</span><b>Île au Trésor</b><small>96 tuiles</small></button>
      <button class="island" data-level="6"><span>🧜</span><b>Crique des Sirènes</b><small>108 tuiles</small></button>
      <button class="island" data-level="7"><span>👻</span><b>Archipel Fantôme</b><small>120 tuiles</small></button>
      <button class="island" data-level="8"><span>🐙</span><b>Grotte du Kraken</b><small>132 tuiles</small></button>
      <button class="island" data-level="9"><span>🌪️</span><b>Fort de la Tempête</b><small>144 tuiles</small></button>
      <button class="island" data-level="10"><span>🏴‍☠️</span><b>Mer des Corsaires</b><small>144 tuiles</small></button>
      <button class="island" data-level="11"><span>⚓</span><b>Île des Épaves</b><small>144 tuiles</small></button>
      <button class="island" data-level="12"><span>🐉</span><b>Baie du Dragon</b><small>144 tuiles</small></button>
      <button class="island" data-level="13"><span>🦈</span><b>Citadelle du Requin</b><small>144 tuiles</small></button>
      <button class="island" data-level="14"><span>🌋</span><b>Volcan des Pirates</b><small>144 tuiles</small></button>
      <button class="island" data-level="15"><span>👑</span><b>Grand Trésor</b><small>144 tuiles</small></button>
    </div>
  </section>

  <section id="game" class="game-panel hidden">
    <header class="game-head"><div><small>AVENTURE EN COURS</small><h2 id="islandTitle">Île du Départ</h2><span id="difficulty" class="badge">Facile</span></div><button id="homeBtn" class="wood-btn">← Accueil</button></header>
    <div class="level-targets"><div><b id="goal1">270</b><small>⚓</small></div><div><b id="goal2">540</b><small>🏴‍☠️</small></div><div><b id="goal3">900</b><small>💰</small></div><div class="target-line"><i id="goalBar"></i></div></div>
    <div class="hud"><div><small>Score</small><b id="score">0</b></div><div><small>Restantes</small><b id="remaining">0</b></div><div><small>Temps</small><b id="time">00:00</b></div><div><small>Coups</small><b id="moves">0</b></div><div><small>Paires</small><b id="pairs">0</b></div></div>
    <div class="actions"><button id="hint" type="button">💡 Indice</button><button id="shuffle" type="button">🔀 Mélanger</button><button id="restart" type="button">🔄 Rejouer</button></div>
    <div id="msg" class="message"></div>
    <div id="board" class="board"></div>
    <div class="boosters"><button id="undo" type="button"><span>↩️</span><small>Annuler</small><b id="undoCount">0</b></button><button id="bomb" type="button"><span>💣</span><small>Canon</small></button><button id="hint2" type="button"><span>💡</span><small>Boussole</small></button><button id="shuffle2" type="button"><span>🔀</span><small>Mélange</small><b id="shuffleCount">0</b></button></div>
  </section>
</main>

<dialog id="deadlock" class="modal"><div>⚓</div><h2>Impasse !</h2><p id="deadlockText"></p><div class="modal-actions"><button id="deadlockShuffle" type="button">🔀 Mélanger</button><button id="deadlockRestart" type="button">🔄 Recommencer</button></div></dialog>
<dialog id="lose" class="modal"><h2>Partie bloquée</h2><p id="loseText"></p><div class="modal-actions"><button id="loseUndo" type="button">↩️ Annuler</button><button id="loseRestart" type="button">🔄 Recommencer</button></div></dialog>
<dialog id="win" class="modal"><h2>🏆 Trésor découvert !</h2><p id="winText"></p><div id="stars">★★★</div><p>🪙 <b id="rewardCoins">0</b> &nbsp; ✨ <b id="rewardXp">0</b> XP</p><div class="modal-actions"><button id="homeWin" type="button">Accueil</button><button id="next" type="button">Île suivante</button></div></dialog>

<script src="app.js?v=clean-2" defer></script>
<script src="home-ui.js?v=clean-2" defer></script>
<script src="dialog-fix.js?v=clean-1" defer></script>
</body>
</html>
